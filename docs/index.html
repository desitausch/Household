<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>Putzplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1c2420;
    --muted: #66736d;
    --accent: #2f7d5d;
    --accent-soft: #e2f0ea;
    --done: #9aa8a1;
    --border: #e3e8e5;
    --shadow: 0 1px 3px rgba(20, 40, 30, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --card: #1e2622;
      --text: #e8ede9;
      --muted: #93a09a;
      --accent: #4fae87;
      --accent-soft: #24382f;
      --done: #5f6d66;
      --border: #2c3630;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 16px 48px;
    max-width: 560px;
    margin: 0 auto;
  }
  header { padding: 8px 4px 16px; }
  h1 { font-size: 1.5rem; font-weight: 700; }
  .week { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
  .note {
    background: var(--accent-soft);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .progress-wrap {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-label strong { color: var(--text); }
  .progress-bar {
    height: 10px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    border-radius: 5px;
    transition: width 0.35s ease;
  }
  .all-done {
    display: none;
    text-align: center;
    font-size: 1rem;
    margin-top: 10px;
    color: var(--accent);
    font-weight: 600;
  }
  h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 22px 6px 10px;
  }
  ul.tasks { list-style: none; }
  li.task {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 10px;
  }
  li.task label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 14px;
    cursor: pointer;
    min-height: 60px;
    -webkit-tap-highlight-color: transparent;
  }
  li.task input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: none;
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--muted);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .box svg { width: 18px; height: 18px; opacity: 0; transform: scale(0.5); transition: all 0.15s ease; }
  li.task input:checked + .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  li.task input:checked + .box svg { opacity: 1; transform: scale(1); }
  .task-text { font-size: 1.05rem; line-height: 1.4; }
  li.task input:checked ~ .task-text {
    color: var(--done);
    text-decoration: line-through;
  }
  .empty {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 6px;
  }
  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <header>
    <h1 id="titel">Putzplan</h1>
    <div class="week" id="week-label"></div>
  </header>

  <div class="note" id="hinweis" hidden></div>

  <div class="progress-wrap">
    <div class="progress-label"><span>Erledigt</span><strong id="progress-text">0 von 0</strong></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="all-done" id="all-done">Alles erledigt – vielen Dank! 🎉</div>
  </div>

  <h2>Jede Woche</h2>
  <ul class="tasks" id="list-woechentlich"></ul>

  <h2>Diese Woche zusätzlich</h2>
  <ul class="tasks" id="list-zusatz"></ul>

  <footer id="footer"></footer>

<script>
(function () {
  "use strict";

  /* Fallback, falls tasks.json nicht geladen werden kann (z.B. offline). */
  var DEFAULT_TASKS = {
    titel: "Putzplan",
    hinweis: "",
    woechentlich: [
      { id: "w1", text: "Böden saugen und wischen (alle Räume)" },
      { id: "w2", text: "Bad putzen: Dusche, Waschbecken, WC" },
      { id: "w3", text: "Küche: Arbeitsflächen und Herd reinigen" },
      { id: "w4", text: "Müll rausbringen und Mülleimer auswischen" },
      { id: "w5", text: "Betten frisch beziehen" },
      { id: "w6", text: "Staub wischen (Regale, Fensterbänke)" }
    ],
    zusatz: []
  };

  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  /* ---- Kalenderwoche (ISO 8601) ---- */
  function isoWeek(date) {
    var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    var day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    var week = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
    return { year: d.getUTCFullYear(), week: week };
  }
  function weekKey(date) {
    var w = isoWeek(date);
    return w.year + "-W" + String(w.week).padStart(2, "0");
  }
  function weekRangeLabel(date) {
    var d = new Date(date);
    var day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1);
    var monday = new Date(d);
    var sunday = new Date(d);
    sunday.setDate(sunday.getDate() + 6);
    var fmt = function (x) { return x.getDate() + "." + (x.getMonth() + 1) + "."; };
    return "KW " + isoWeek(date).week + " · " + fmt(monday) + " – " + fmt(sunday);
  }

  var currentWeek = weekKey(new Date());
  var storageKey = "putzplan-" + currentWeek;

  /* ---- Erledigt-Status (pro Woche, bleibt auf dem Handy gespeichert) ---- */
  function loadDone() {
    try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
    catch (e) { return {}; }
  }
  function saveDone(done) {
    try { localStorage.setItem(storageKey, JSON.stringify(done)); } catch (e) {}
  }
  function cleanupOldWeeks() {
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var k = localStorage.key(i);
        if (k && k.indexOf("putzplan-") === 0 && k !== storageKey && k !== "putzplan-cache") {
          localStorage.removeItem(k);
        }
      }
    } catch (e) {}
  }

  var tasksData = DEFAULT_TASKS;

  function visibleZusatz() {
    return (tasksData.zusatz || []).filter(function (t) {
      return !t.woche || t.woche === currentWeek;
    });
  }

  function render() {
    var done = loadDone();
    document.getElementById("titel").textContent = tasksData.titel || "Putzplan";
    document.title = tasksData.titel || "Putzplan";
    document.getElementById("week-label").textContent = weekRangeLabel(new Date());

    var hinweisEl = document.getElementById("hinweis");
    if (tasksData.hinweis) {
      hinweisEl.textContent = tasksData.hinweis;
      hinweisEl.hidden = false;
    } else {
      hinweisEl.hidden = true;
    }

    renderList("list-woechentlich", tasksData.woechentlich || [], done, "Keine Aufgaben eingetragen.");
    renderList("list-zusatz", visibleZusatz(), done, "Diese Woche nichts Zusätzliches. 👍");
    updateProgress();
  }

  function renderList(elId, tasks, done, emptyText) {
    var ul = document.getElementById(elId);
    ul.innerHTML = "";
    if (!tasks.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = emptyText;
      ul.appendChild(li);
      return;
    }
    tasks.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task";
      var label = document.createElement("label");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!done[t.id];
      input.addEventListener("change", function () {
        var d = loadDone();
        if (input.checked) { d[t.id] = true; } else { delete d[t.id]; }
        saveDone(d);
        updateProgress();
        var span = label.querySelector(".task-text");
        span.classList.toggle("done", input.checked);
      });
      var box = document.createElement("span");
      box.className = "box";
      box.innerHTML = CHECK_SVG;
      var span = document.createElement("span");
      span.className = "task-text";
      span.textContent = t.text;
      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(span);
      li.appendChild(label);
      ul.appendChild(li);
    });
  }

  function updateProgress() {
    var done = loadDone();
    var all = (tasksData.woechentlich || []).concat(visibleZusatz());
    var total = all.length;
    var count = all.filter(function (t) { return done[t.id]; }).length;
    document.getElementById("progress-text").textContent = count + " von " + total;
    document.getElementById("progress-fill").style.width = total ? (100 * count / total) + "%" : "0%";
    document.getElementById("all-done").style.display = (total > 0 && count === total) ? "block" : "none";
  }

  /* ---- Aufgaben laden und regelmäßig aktualisieren ---- */
  function applyData(data) {
    if (data && (data.woechentlich || data.zusatz)) {
      tasksData = data;
      try { localStorage.setItem("putzplan-cache", JSON.stringify(data)); } catch (e) {}
      render();
    }
  }

  function fetchTasks() {
    fetch("tasks.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(applyData)
      .catch(function () { /* offline oder Datei fehlt: letzten Stand behalten */ });
  }

  /* Neue Woche erkennen, falls die Seite tagelang offen bleibt */
  function checkNewWeek() {
    var now = weekKey(new Date());
    if (now !== currentWeek) {
      currentWeek = now;
      storageKey = "putzplan-" + currentWeek;
      cleanupOldWeeks();
      render();
    }
  }

  /* Start: erst Cache, dann frisch laden */
  try {
    var cached = JSON.parse(localStorage.getItem("putzplan-cache"));
    if (cached) { tasksData = cached; }
  } catch (e) {}

  cleanupOldWeeks();
  render();
  fetchTasks();

  setInterval(function () { checkNewWeek(); fetchTasks(); }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { checkNewWeek(); fetchTasks(); }
  });

  document.getElementById("footer").innerHTML =
    "Haken werden auf diesem Handy gespeichert und starten jede Woche neu.<br>Die Liste aktualisiert sich automatisch.";
})();
</script>
</body>
</html>
