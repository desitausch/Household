<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>Unser Haushalt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1c2420;
    --muted: #66736d;
    --accent: #2f7d5d;
    --accent-soft: #e2f0ea;
    --border: #e3e8e5;
    --shadow: 0 1px 3px rgba(20, 40, 30, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17;
      --card: #1e2622;
      --text: #e8ede9;
      --muted: #93a09a;
      --accent: #4fae87;
      --accent-soft: #24382f;
      --border: #2c3630;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  nav {
    position: sticky;
    top: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 10;
  }
  .nav-inner {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 12px;
  }
  .brand {
    font-weight: 700;
    font-size: 1rem;
    margin-right: auto;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  nav a.link {
    text-decoration: none;
    color: var(--muted);
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 10px;
  }
  nav a.link.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 8px 4px 4px; }
  .sub { color: var(--muted); font-size: 0.95rem; margin: 0 4px 20px; }
  a.project {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--text);
  }
  .project .icon {
    flex: none;
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
  }
  .project .name { font-size: 1.1rem; font-weight: 600; }
  .project .desc { color: var(--muted); font-size: 0.9rem; margin-top: 2px; line-height: 1.4; }
  .project .arrow { margin-left: auto; color: var(--muted); font-size: 1.2rem; }
  .coming {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 18px;
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="brand" href="./">🏠 Haushalt</a>
      <a class="link active" href="./">Start</a>
      <a class="link" href="putzplan/">Putzplan</a>
    </div>
  </nav>
  <main>
    <h1>Unser Haushalt</h1>
    <p class="sub">Alle Pläne und Übersichten an einem Ort.</p>

    <a class="project" href="putzplan/">
      <span class="icon">✨</span>
      <span>
        <span class="name">Putzplan</span>
        <span class="desc" style="display:block">Wöchentliche Aufgaben zum Abhaken</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <div class="coming">Weitere Projekte folgen hier …</div>
  </main>
</body>
</html>
