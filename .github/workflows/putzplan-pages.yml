name: Haushalts-Seite veröffentlichen

# Veröffentlicht die Seite über den gh-pages-Branch. GitHub aktiviert Pages
# für diesen Branch automatisch — das Anlegen der Pages-Site per API würde
# dagegen Admin-Rechte erfordern, die der Workflow-Token nicht bekommt.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "putzplan/**"
      - ".github/workflows/putzplan-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html _site/
          cp -r putzplan _site/putzplan
          touch _site/.nojekyll
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
