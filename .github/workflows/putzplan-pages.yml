name: Haushalts-Seite veröffentlichen

# Solange GitHub Pages für dieses (private) Repo nicht verfügbar ist, läuft
# dieser Workflow nur manuell (workflow_dispatch). Sobald das Hosting geklärt
# ist, den push-Trigger wieder aktivieren:
#
#   on:
#     push:
#       branches: [main]
#       paths:
#         - "index.html"
#         - "putzplan/**"
#         - ".github/workflows/putzplan-pages.yml"
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html _site/
          cp -r putzplan _site/putzplan
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
